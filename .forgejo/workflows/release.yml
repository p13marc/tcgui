name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: Build release artifacts
        run: |
          mkdir -p dist/release
          name="${GITHUB_REPOSITORY#*/}"
          git archive --format=tar.gz --prefix="${name}-${GITHUB_REF_NAME}/" \
            -o "dist/release/${name}-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_REF_NAME}"
          (cd dist/release && sha256sum * > SHA256SUMS)
      - uses: https://data.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          # internal URL: the runner zone cannot hairpin to the public vhost
          url: http://10.10.0.30:3000
          repo: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          release-dir: dist/release
          token: ${{ secrets.GITHUB_TOKEN }}

  backend-image:
    runs-on: ubuntu-24.04
    container:
      # daemonless build+push; no node inside → no JS actions in this job
      image: quay.io/buildah/stable:latest
    env:
      REGISTRY: 10.10.0.30:3000
      BUILDAH_ISOLATION: chroot
      STORAGE_DRIVER: vfs
    steps:
      - name: Clone
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "http://forgejo:${GITHUB_TOKEN}@10.10.0.30:3000/${GITHUB_REPOSITORY}.git" src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        run: |
          image="$REGISTRY/marcpardo/tcgui-backend"
          cd src
          buildah login --tls-verify=false -u marcpardo -p "${{ secrets.REGISTRY_TOKEN }}" "$REGISTRY"
          # layer cache lives in the registry (real TLS via the hairpin fix);
          # pruned by the Forgejo packages cleanup rule on *-cache
          buildah login -u marcpardo -p "${{ secrets.REGISTRY_TOKEN }}" git.marcpardo.eu
          buildah build --layers \
            --cache-from=git.marcpardo.eu/marcpardo/tcgui-backend-cache \
            --cache-to=git.marcpardo.eu/marcpardo/tcgui-backend-cache \
            --cache-ttl=168h \
            --label "org.opencontainers.image.source=https://git.marcpardo.eu/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$image:${GITHUB_REF_NAME}" -t "$image:latest" -f docker/Dockerfile.backend .
          buildah push --tls-verify=false "$image:${GITHUB_REF_NAME}"
          buildah push --tls-verify=false "$image:latest"

  flatpak:
    runs-on: flatpak
    env:
      # SDK/runtime installs persist on the runner cache disk
      FLATPAK_USER_DIR: /srv/cache/flatpak/inst
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - name: Build flatpak (unsigned; vm-edge signs on publish)
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # per-repo state dir on the cache disk: incremental module rebuilds
          # + ccache for C/C++ inside the sandbox. flatpak-builder requires
          # state dir and build tree on the same filesystem -> stage the
          # build on the cache disk and copy the bundle back.
          work=/srv/cache/flatpak/tcgui/work
          mkdir -p "$work" && rm -rf "$work/src" && cp -a . "$work/src"
          cd "$work/src"
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --state-dir=/srv/cache/flatpak/tcgui/state --ccache \
            --install-deps-from=flathub \
            --repo=export-repo builddir flatpak/com.github.p13marc.TcGui.yml
          mkdir -p "$GITHUB_WORKSPACE/dist/release"
          flatpak build-bundle export-repo \
            "$GITHUB_WORKSPACE/dist/release/tcgui-${GITHUB_REF_NAME}.flatpak" com.github.p13marc.TcGui
      - name: Publish export branch for vm-edge
        run: |
          cd /srv/cache/flatpak/tcgui/work/src/export-repo
          git init -q -b flatpak-export
          git add -A
          git -c user.name=ci -c user.email=ci@marcpardo.eu commit -q -m "flatpak export ${GITHUB_REF_NAME}"
          git push --force "http://forgejo:${{ secrets.GITHUB_TOKEN }}@10.10.0.30:3000/${GITHUB_REPOSITORY}.git" HEAD:flatpak-export
      - uses: https://data.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: http://10.10.0.30:3000
          repo: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          release-dir: dist/release
          token: ${{ secrets.GITHUB_TOKEN }}
